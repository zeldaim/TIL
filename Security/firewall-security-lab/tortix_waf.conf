# =============================================================
# ModSecurity WAF Custom Rules - tortix_waf.conf
# Author: zeldaim
# Description: 웹 애플리케이션 공격 탐지 및 차단 룰셋
# Environment: Apache + ModSecurity 2.6.x (CentOS5)
# =============================================================

# --------------------------------------------------------------
# [기본 설정]
# --------------------------------------------------------------
SecRuleEngine On
SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLog logs/modsec_audit.log
SecAuditLogParts ABCFHZ

SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType (null) text/html text/plain text/xml
SecResponseBodyLimit 524288

SecDefaultAction "pass,log,auditlog,phase:4,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"

# --------------------------------------------------------------
# [HTTP 메서드 제한]
# 불필요한 HTTP 메서드 차단
# --------------------------------------------------------------
SecRule REQUEST_METHOD "(PUT|DELETE|TRACE|CONNECT|TRACK)" \
    "id:1001,\
    phase:1,\
    deny,\
    log,\
    auditlog,\
    status:405,\
    msg:'Disallowed HTTP method'"

# --------------------------------------------------------------
# [ARGS - 셸코드 탐지]
# GET/POST 파라미터에서 셸코드 패턴 탐지
# --------------------------------------------------------------
######## ARGS ########
SecRule ARGS ^shell. \
    "id:2001,\
    phase:2,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'Shellcode pattern detected in ARGS',\
    redirect:/error.html"

# --------------------------------------------------------------
# [ARGS - SQL Injection 탐지]
# 주요 SQLi 패턴 탐지
# --------------------------------------------------------------
SecRule ARGS \
    "(?i:(\bselect\b.+\bfrom\b|\bunion\b.+\bselect\b|\binsert\b.+\binto\b|\bdelete\b.+\bfrom\b|\bdrop\b.+\btable\b))" \
    "id:2002,\
    phase:2,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'SQL Injection attempt detected',\
    redirect:/error.html"

# --------------------------------------------------------------
# [ARGS - XSS 탐지]
# 크로스사이트 스크립팅 패턴 탐지
# --------------------------------------------------------------
SecRule ARGS \
    "(?i:(<script|javascript:|vbscript:|onload=|onerror=|onclick=))" \
    "id:2003,\
    phase:2,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'XSS attempt detected',\
    redirect:/error.html"

# --------------------------------------------------------------
# [REQUEST_URI - 정규식 패턴 탐지]
# URI에서 변형 패턴 탐지 (예: patt+ern)
# --------------------------------------------------------------
SecRule REQUEST_URI \
    "@rx patt+ern" \
    "id:3001,\
    phase:1,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'Suspicious URI pattern detected',\
    redirect:/error.html"

# --------------------------------------------------------------
# [REQUEST_URI - 어드민 페이지 접근 차단]
# /admin 경로 접근 시도 차단
# --------------------------------------------------------------
SecRule REQUEST_URI \
    "admin" \
    "id:3002,\
    phase:1,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'Admin page access blocked',\
    redirect:/error.html"

# --------------------------------------------------------------
# [REQUEST_URI - 민감 파일 접근 차단]
# .env, .git, passwd 등 민감 경로 차단
# --------------------------------------------------------------
SecRule REQUEST_URI \
    "@rx (\.(env|git|htaccess|htpasswd|bak|sql|conf)|/etc/passwd|/etc/shadow)" \
    "id:3003,\
    phase:1,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'Sensitive file access blocked',\
    redirect:/error.html"

# --------------------------------------------------------------
# [REQUEST_URI - 웹 셸 접근 차단]
# 웹 셸 파일명 패턴 차단
# --------------------------------------------------------------
SecRule REQUEST_URI \
    "@rx (shell|cmd|c99|r57|webshell|backdoor)\.(php|asp|aspx|jsp)" \
    "id:3004,\
    phase:1,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'Web shell access blocked',\
    redirect:/error.html"

# --------------------------------------------------------------
# [REQUEST_URI - 디렉토리 트래버설 차단]
# ../ 경로 탈출 시도 차단
# --------------------------------------------------------------
SecRule REQUEST_URI \
    "@rx (\.\./|\.\.\\\\)" \
    "id:3005,\
    phase:1,\
    deny,\
    log,\
    auditlog,\
    status:403,\
    msg:'Directory traversal blocked',\
    redirect:/error.html"
